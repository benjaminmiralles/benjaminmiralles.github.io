<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxtral WebGPU - Micro</title>
    <link rel="stylesheet" href="src/style.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Historique</h2>
        <p class="sidebar-help">Retrouvez les transcriptions déjà réalisées.</p>
        <div id="historyList" class="history-list">
          <p id="emptyHistory" class="empty-history">Aucune transcription pour le moment.</p>
        </div>
      </aside>

      <main class="content" id="app">
        <h1>Voxtral WebGPU - Transcription Micro</h1>

        <div class="controls">
          <button id="recordBtn">Démarrer l'enregistrement</button>
          <button id="generate" disabled>Lancer la transcription</button>
        </div>

        <div id="loadingProgress" class="progress-wrapper">
          <div class="progress-meta">
            <span id="progressLabel">Téléchargement des fichiers du modèle...</span>
            <span id="progressText">0 / 3</span>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>

        <p id="status">En attente du modèle...</p>
        <div id="recordStatus"></div>

        <pre id="output"></pre>
      </main>
    </div>
  </body>
</html>

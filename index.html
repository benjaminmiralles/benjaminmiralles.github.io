<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxtral WebGPU - Micro</title>
    <link rel="stylesheet" href="src/style.css" />
	<script type="importmap">
	  {
		"imports": {
		  "@huggingface/transformers": "https://esm.sh/@huggingface/transformers"
		}
	  }
	</script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Historique</h2>
          <label class="theme-switch" for="themeToggle">
            <input id="themeToggle" type="checkbox" />
            <span>Mode sombre</span>
          </label>
        </div>
        <div id="historyList" class="history-list">
          <p id="emptyHistory" class="empty-history">Aucune transcription pour le moment.</p>
        </div>
        <button id="clearHistoryBtn" class="clear-history-btn" type="button">Supprimer tous les transcripts</button>
      </aside>

      <main class="content" id="app">
        <h1>Voxtral WebGPU - Transcription Micro</h1>

        <div id="loadingProgress" class="progress-wrapper">
          <div class="progress-meta">
            <span id="progressLabel">Téléchargement des fichiers du modèle...</span>
            <span id="progressText">0 / 3</span>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <ul id="progressFiles" class="progress-files"></ul>
        </div>

        <div class="controls">
          <button id="recordBtn">Démarrer l'enregistrement</button>
          <button id="generate" disabled>Lancer la transcription</button>
          <button id="summarize" disabled>Lancer le résumé</button>
        </div>

        <div id="recordStatus"></div>

        <h2 class="section-title">Transcript</h2>
        <label for="transcriptPromptSelect" class="prompt-label">Prompt de transcription</label>
        <select id="transcriptPromptSelect" class="prompt-select">
          <option value="default" selected>Français (défaut)</option>
          <option value="medecin-allemand">Médecin Allemand</option>
        </select>
        <pre id="output"></pre>

        <h2 class="section-title">Résumé</h2>
        <label for="summaryPrompt" class="prompt-label">Prompt de résumé</label>
        <textarea
          id="summaryPrompt"
          class="prompt-input"
          rows="3"
        ></textarea>
        <pre id="summaryOutput"></pre>


		<script type="module" src="src/main.js"></script>
      </main>
    </div>

    <div class="throughput-bar" aria-live="polite">
      <p id="throughputInfo" class="throughput-info hidden"></p>
      <p id="summaryThroughputInfo" class="throughput-info hidden"></p>
    </div>
  </body>
</html>
